name: Test gem

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Install test dependencies
        run: gem install prism rspec --no-document
      - name: Run tests (including real RSpec integration)
        run: ruby -Ilib -e 'Dir["test/*_test.rb"].each { |f| require_relative f }'
      - name: Build gem
        run: gem build sabun.gemspec
